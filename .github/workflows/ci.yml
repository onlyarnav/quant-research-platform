name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .
          pip install flake8 black isort pytest-cov

      - name: Run Black code style check
        run: |
          black --check --line-length 88 src config scripts tests

      - name: Run isort import sorting check
        run: |
          isort --check --profile black src config scripts tests

      - name: Run Flake8 linter
        run: |
          flake8 src config scripts tests --max-line-length=88 --extend-ignore=E203,W503

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quant_research
        run: |
          alembic upgrade head

      - name: Run Unit and Integration Tests with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quant_research
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing
