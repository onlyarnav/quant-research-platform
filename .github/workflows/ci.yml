name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, "release/*" ]
  pull_request:
    branches: [ main, master, develop, "release/*" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quant_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quant_research"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements/constraints.txt
          pip install .[dev]

      - name: Run Unified Static & Fast Verification Runner
        run: |
          python scripts/verify_all.py --fast

      - name: Validate Production Docker Compose Spec
        run: |
          python scripts/verify_all.py --docker

      - name: Run Database Migrations (Upgrade/Downgrade/Upgrade Drill)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quant_research
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic check

      - name: Run Full Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quant_research
        run: |
          pytest --cov=src --cov-report=term-missing tests/
