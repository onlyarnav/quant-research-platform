<!DOCTYPE html><html><head><meta charset='utf-8'><style>
body { margin: 0; padding: 20px; background: white; font-family: 'Times New Roman', serif; }
.state-box { fill: #f8fafc; stroke: #1e3a8a; stroke-width: 2; rx: 8px; }
.hdr-box { fill: #1e3a8a; rx: 6px; }
.txt-white { fill: white; font-size: 13px; font-weight: bold; text-anchor: middle; }
.txt-dark { fill: #0f172a; font-size: 11px; text-anchor: middle; }
.arrow { stroke: #0f172a; stroke-width: 2; marker-end: url(#arrowhead); }
</style></head><body>
<svg viewBox='0 0 1060 550' width='1020' height='520' xmlns='http://www.w3.org/2000/svg'>
<defs><marker id='arrowhead' markerWidth='8' markerHeight='6' refX='7' refY='3' orient='auto'>
<polygon points='0 0, 8 3, 0 6' fill='#0f172a'/></marker></defs>
<rect x='10' y='10' width='1040' height='530' fill='#ffffff' stroke='#cbd5e1' stroke-width='2' rx='8'/>
<text x='530' y='35' font-size='16' font-weight='bold' fill='#0f172a' text-anchor='middle'>Backtesting Execution State Machine & Daily Portfolio Loop</text>

<!-- State 1: FLAT -->
<g transform='translate(60, 100)'>
<rect width='240' height='160' class='state-box'/>
<rect width='240' height='32' class='hdr-box'/>
<text x='120' y='22' class='txt-white'>STATE: FLAT (Cash Pool)</text>
<text x='120' y='60' class='txt-dark'>Position Quantity = 0</text>
<text x='120' y='85' class='txt-dark'>Capital uncommitted</text>
<text x='120' y='110' class='txt-dark'>HOLD (0) / SELL (-1): No Op</text>
<text x='120' y='135' class='txt-dark'>Awaits BUY (+1) Signal</text>
</g>

<!-- State 2: LONG -->
<g transform='translate(480, 100)'>
<rect width='260' height='160' class='state-box'/>
<rect width='260' height='32' fill='#047857' rx='6'/>
<text x='130' y='22' class='txt-white'>STATE: LONG (Invested)</text>
<text x='130' y='60' class='txt-dark'>Position Quantity &gt; 0</text>
<text x='130' y='85' class='txt-dark'>Marked-to-Market Daily</text>
<text x='130' y='110' class='txt-dark'>HOLD (0) / BUY (+1): Maintain</text>
<text x='130' y='135' class='txt-dark'>Awaits SELL (-1) Signal</text>
</g>

<!-- State 3: CLOSED -->
<g transform='translate(850, 100)'>
<rect width='160' height='160' class='state-box'/>
<rect width='160' height='32' fill='#334155' rx='6'/>
<text x='80' y='22' class='txt-white'>STATE: CLOSED</text>
<text x='80' y='60' class='txt-dark'>End of Simulation</text>
<text x='80' y='85' class='txt-dark'>Force Liquidation</text>
<text x='80' y='110' class='txt-dark'>Generate Final Log</text>
<text x='80' y='135' class='txt-dark'>Export PnL &amp; Stats</text>
</g>

<!-- Transitions -->
<path d='M 300 150 L 480 150' class='arrow'/>
<text x='390' y='135' font-size='10' font-weight='bold' fill='#15803d' text-anchor='middle'>BUY Signal (+1)</text>
<text x='390' y='168' font-size='9' fill='#334155' text-anchor='middle'>Fill = P(1+s) + Fees</text>

<path d='M 480 210 L 300 210' class='arrow'/>
<text x='390' y='200' font-size='10' font-weight='bold' fill='#dc2626' text-anchor='middle'>SELL Signal (-1)</text>
<text x='390' y='228' font-size='9' fill='#334155' text-anchor='middle'>Fill = P(1-s) - Fees</text>

<path d='M 740 180 L 850 180' class='arrow'/>
<text x='795' y='170' font-size='9' font-weight='bold' fill='#334155' text-anchor='middle'>Final Bar</text>

<!-- Daily Simulation Loop (Bottom Panel) -->
<g transform='translate(50, 310)'>
<rect width='960' height='200' fill='#f8fafc' stroke='#cbd5e1' rx='6'/>
<text x='480' y='28' font-size='13' font-weight='bold' fill='#1e3a8a' text-anchor='middle'>Daily Multi-Asset Simulation Engine: Strict Order-of-Execution</text>

<rect x='20' y='50' width='170' height='120' fill='#ffffff' stroke='#94a3b8' rx='4'/>
<text x='105' y='75' font-size='11' font-weight='bold' fill='#0f172a' text-anchor='middle'>Step 1: Price Update</text>
<text x='105' y='105' font-size='10' fill='#334155' text-anchor='middle'>Fetch daily Close &amp; Adj</text>
<text x='105' y='125' font-size='10' fill='#334155' text-anchor='middle'>Update asset cache</text>

<line x1='190' y1='110' x2='215' y2='110' class='arrow'/>

<rect x='215' y='50' width='170' height='120' fill='#ffffff' stroke='#94a3b8' rx='4'/>
<text x='300' y='75' font-size='11' font-weight='bold' fill='#b91c1c' text-anchor='middle'>Step 2: Process SELLs</text>
<text x='305' y='105' font-size='10' fill='#334155' text-anchor='middle'>Execute liquidations</text>
<text x='305' y='125' font-size='10' fill='#334155' text-anchor='middle'>Deduct fees, credit cash</text>

<line x1='385' y1='110' x2='410' y2='110' class='arrow'/>

<rect x='410' y='50' width='170' height='120' fill='#ffffff' stroke='#94a3b8' rx='4'/>
<text x='495' y='75' font-size='11' font-weight='bold' fill='#15803d' text-anchor='middle'>Step 3: Process BUYs</text>
<text x='495' y='105' font-size='10' fill='#334155' text-anchor='middle'>Check cash &amp; 5% cap</text>
<text x='495' y='125' font-size='10' fill='#334155' text-anchor='middle'>Deduct cost + fees</text>

<line x1='580' y1='110' x2='605' y2='110' class='arrow'/>

<rect x='605' y='50' width='170' height='120' fill='#ffffff' stroke='#94a3b8' rx='4'/>
<text x='690' y='75' font-size='11' font-weight='bold' fill='#0369a1' text-anchor='middle'>Step 4: Mark to Market</text>
<text x='690' y='105' font-size='10' fill='#334155' text-anchor='middle'>Invested = Î£ (qty Ã— px)</text>
<text x='690' y='125' font-size='10' fill='#334155' text-anchor='middle'>Total = Cash + Invested</text>

<line x1='775' y1='110' x2='800' y2='110' class='arrow'/>

<rect x='800' y='50' width='140' height='120' fill='#ffffff' stroke='#94a3b8' rx='4'/>
<text x='870' y='75' font-size='11' font-weight='bold' fill='#0f172a' text-anchor='middle'>Step 5: Record</text>
<text x='870' y='105' font-size='10' fill='#334155' text-anchor='middle'>Daily return, DD</text>
<text x='870' y='125' font-size='10' fill='#334155' text-anchor='middle'>Save snapshot</text>
</g>

</svg></body></html>
