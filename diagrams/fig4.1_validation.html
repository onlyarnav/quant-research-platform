<!DOCTYPE html><html><head><meta charset='utf-8'><style>
body { margin: 0; padding: 20px; background: white; font-family: 'Times New Roman', serif; }
.act-start { fill: #0f172a; }
.act-box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 6px; }
.act-dec { fill: #fef08a; stroke: #ca8a04; stroke-width: 1.5; }
.act-reject { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; rx: 4px; }
.act-pass { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; rx: 4px; }
.txt { font-size: 11px; fill: #0f172a; font-weight: bold; text-anchor: middle; }
.txt-red { font-size: 10px; fill: #991b1b; font-weight: bold; text-anchor: middle; }
.arrow { stroke: #334155; stroke-width: 1.6; marker-end: url(#arrowhead); }
</style></head><body>
<svg viewBox='0 0 1060 650' width='1020' height='620' xmlns='http://www.w3.org/2000/svg'>
<defs><marker id='arrowhead' markerWidth='7' markerHeight='5' refX='6' refY='2.5' orient='auto'>
<polygon points='0 0, 7 2.5, 0 5' fill='#334155'/></marker></defs>
<rect x='10' y='10' width='1040' height='630' fill='#ffffff' stroke='#cbd5e1' stroke-width='2' rx='8'/>
<text x='530' y='35' font-size='16' font-weight='bold' fill='#0f172a' text-anchor='middle'>Activity Flow: Multi-Stage Data Validation Quality Gates & Rejection Logging</text>

<!-- Start -->
<circle cx='530' cy='65' r='12' class='act-start'/>

<!-- Step 1: Null Check -->
<polygon points='530,100 620,135 530,170 440,135' class='act-dec'/>
<text x='530' y='132' class='txt'>Nulls in OHLCV?</text>
<line x1='530' y1='77' x2='530' y2='100' class='arrow'/>

<line x1='620' y1='135' x2='780' y2='135' class='arrow'/>
<rect x='780' y='115' width='220' height='40' class='act-reject'/>
<text x='890' y='138' class='txt-red'>Drop Row &amp; Log Warning</text>

<!-- Step 2: High >= Low -->
<polygon points='530,200 620,235 530,270 440,235' class='act-dec'/>
<text x='530' y='232' class='txt'>High &gt;= Low?</text>
<line x1='530' y1='170' x2='530' y2='200' class='arrow'/>
<text x='545' y='188' font-size='10' fill='#15803d'>No</text>

<line x1='620' y1='235' x2='780' y2='235' class='arrow'/>
<rect x='780' y='215' width='220' height='40' class='act-reject'/>
<text x='890' y='238' class='txt-red'>Reject: High &lt; Low Invariant</text>
<text x='640' y='225' font-size='10' fill='#dc2626'>Fail</text>

<!-- Step 3: Low <= Open, Close <= High -->
<polygon points='530,300 640,335 530,370 420,335' class='act-dec'/>
<text x='530' y='332' class='txt'>Low &lt;= Open,Close &lt;= High?</text>
<line x1='530' y1='270' x2='530' y2='300' class='arrow'/>
<text x='545' y='288' font-size='10' fill='#15803d'>Pass</text>

<line x1='640' y1='335' x2='780' y2='335' class='arrow'/>
<rect x='780' y='315' width='220' height='40' class='act-reject'/>
<text x='890' y='338' class='txt-red'>Reject: Price Bounds Out of Range</text>
<text x='660' y='325' font-size='10' fill='#dc2626'>Fail</text>

<!-- Step 4: Volume >= 0 -->
<polygon points='530,400 620,435 530,470 440,435' class='act-dec'/>
<text x='530' y='432' class='txt'>Volume &gt;= 0?</text>
<line x1='530' y1='370' x2='530' y2='400' class='arrow'/>
<text x='545' y='388' font-size='10' fill='#15803d'>Pass</text>

<line x1='620' y1='435' x2='780' y2='435' class='arrow'/>
<rect x='780' y='415' width='220' height='40' class='act-reject'/>
<text x='890' y='438' class='txt-red'>Reject: Negative Volume</text>
<text x='640' y='425' font-size='10' fill='#dc2626'>Fail</text>

<!-- Step 5: Duplicate Check -->
<polygon points='530,500 630,535 530,570 430,535' class='act-dec'/>
<text x='530' y='532' class='txt'>Duplicate (symbol, date)?</text>
<line x1='530' y1='470' x2='530' y2='500' class='arrow'/>
<text x='545' y='488' font-size='10' fill='#15803d'>Pass</text>

<line x1='630' y1='535' x2='780' y2='535' class='arrow'/>
<rect x='780' y='515' width='220' height='40' class='act-reject'/>
<text x='890' y='538' class='txt-red'>Deduplicate: Retain Latest Bar</text>
<text x='650' y='525' font-size='10' fill='#dc2626'>Yes</text>

<!-- Final Acceptance -->
<line x1='530' y1='570' x2='530' y2='600' class='arrow'/>
<rect x='410' y='600' width='240' height='30' class='act-pass'/>
<text x='530' y='620' font-size='11' fill='#15803d' font-weight='bold' text-anchor='middle'>Quality Gate Passed: Write to Parquet</text>

</svg></body></html>
