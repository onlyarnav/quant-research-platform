[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_research_platform"
version = "1.0.0"
description = "Institutional-grade quantitative AI research platform for Indian markets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "joblib>=1.3.0",
    "mlflow>=2.14.0",
    "PyPortfolioOpt>=1.5.5",
    "plotly>=5.20.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "pyarrow>=15.0.0",
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "pytest-randomly>=3.15.0",
    "pytest-xdist>=3.5.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "vulture>=2.11",
    "deptry>=0.16.0",
    "interrogate>=1.7.0",
    "pip-licenses>=4.4.0",
    "pre-commit>=3.7.0",
    "playwright>=1.44.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "config"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "union-attr", "operator", "arg-type", "assignment", "no-any-return", "call-arg", "type-var"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
timeout = 120
timeout_method = "thread"
markers = [
    "db: tests requiring a running PostgreSQL database",
    "integration: end-to-end integration tests",
    "slow: long-running tests",
    "e2e: full browser or deployed service end-to-end tests",
]
filterwarnings = [
    "ignore:Series.values returning an ndarray that drops timezone information:pandas.errors.Pandas4Warning",
    "ignore:The argument 'eval_set' is deprecated:lightgbm.basic.LGBMDeprecationWarning",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv"]